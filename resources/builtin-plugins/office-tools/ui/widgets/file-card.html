<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Карточка файла</title>
  <style>
    :root {
      --bg: #f7f7f9; --bg-2: #ffffff; --text: #1c1c22; --text-2: #5b616e;
      --border: rgba(0, 0, 0, 0.1); --accent: #4f7cff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text); font-size: 12.5px;
      padding: 10px;
    }
    .card {
      border: 1px solid var(--border); border-radius: 10px;
      background: var(--bg-2); padding: 10px 12px;
      display: flex; flex-direction: column; gap: 7px; height: 100%;
    }
    .head { display: flex; gap: 10px; align-items: center; }
    .badge {
      flex: none; width: 32px; height: 32px; border-radius: 8px;
      color: #fff; font-weight: 700; font-size: 15px;
      display: flex; align-items: center; justify-content: center;
    }
    .name { font-weight: 600; font-size: 13px; word-break: break-all; line-height: 1.25; }
    .meta { color: var(--text-2); font-size: 11px; margin-top: 2px; }
    .stats { color: var(--text-2); font-size: 11.5px; line-height: 1.4; }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; }
    button {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 5px 10px; border-radius: 7px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font: inherit; font-size: 11.5px;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    button:disabled { opacity: 0.55; cursor: default; }
    button.done { color: #30a46c; border-color: #30a46c; }
    .err { color: #e5484d; font-size: 11.5px; }
    svg { flex: none; }
  </style>
</head>
<body>
  <div class="card" id="card"></div>
  <script>
    'use strict'

    // ── Мост synteeBridge (шим из docs/ui.md) ──
    var synteeBridge = (function () {
      var seq = 0
      var pending = {}
      var handlers = {}
      window.addEventListener('message', function (e) {
        var d = e.data
        if (!d || d.source !== 'syntee-plugin-host') return
        if (d.rpc && pending[d.id]) {
          var p = pending[d.id]; delete pending[d.id]
          if (d.ok) p.resolve(d.result)
          else p.reject(new Error(d.error || 'RPC error'))
          return
        }
        if (d.theme) return
        if (d.data && d.data.__rpc__) {
          (handlers[d.data.method] || []).forEach(function (cb) {
            try { cb(d.data.data) } catch (err) { console.error(err) }
          })
        }
      })
      return {
        call: function (method, args) {
          var id = 'rpc-' + (++seq)
          return new Promise(function (resolve, reject) {
            pending[id] = { resolve: resolve, reject: reject }
            parent.postMessage({ source: 'syntee-plugin', rpc: true, id: id, method: method, args: args }, '*')
          })
        },
        on: function (method, cb) {
          if (!handlers[method]) handlers[method] = []
          handlers[method].push(cb)
        },
      }
    })()

    // ── Шим темы ──
    function applyTheme(t) {
      if (!t) return
      var s = document.documentElement.style
      s.setProperty('--accent', t.accentColor)
      s.setProperty('--text', t.dark ? '#e6e6ec' : '#1c1c22')
      s.setProperty('--text-2', t.dark ? '#9aa0ae' : '#5b616e')
      s.setProperty('--bg', t.dark ? '#141418' : '#f7f7f9')
      s.setProperty('--bg-2', t.dark ? '#1c1c22' : '#ffffff')
      s.setProperty('--border', t.dark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.10)')
    }
    window.addEventListener('message', function (e) {
      var d = e.data
      if (d && d.source === 'syntee-plugin-host' && d.theme) applyTheme(d.theme)
    })

    // ── Утилиты ──
    function esc(v) {
      return String(v == null ? '' : v)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;')
    }
    function fmtSize(bytes) {
      var n = Number(bytes) || 0
      if (n < 1024) return n + ' Б'
      if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' КБ'
      return (n / (1024 * 1024)).toFixed(1) + ' МБ'
    }
    function opLabel(op) {
      var m = { create: 'создан', edit: 'изменён', read: 'прочитан', export: 'экспорт', open: 'открыт', pdf: 'PDF' }
      return m[op] || op || ''
    }
    function badgeHtml(kind) {
      var k = String(kind || 'word').toLowerCase()
      var conf = {
        word: { letter: 'W', color: '#2b579a' },
        excel: { letter: 'X', color: '#217346' },
        ppt: { letter: 'P', color: '#d24726' },
        pdf: { letter: 'P', color: '#d13438' },
      }[k] || { letter: '?', color: '#8a8f98' }
      return '<span class="badge" style="background:' + conf.color + '">' + conf.letter + '</span>'
    }
    function icon(name) {
      var paths = {
        open: '<path d="M14 3h7v7"/><path d="M10 14 21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/>',
        folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/>',
        pdf: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
      }
      return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">' + (paths[name] || '') + '</svg>'
    }

    var state = { data: null }

    function render(d) {
      state.data = d
      var card = document.getElementById('card')

      var stats = d.stats
      var statsHtml = ''
      if (stats) {
        var parts = []
        if (stats.slides != null) parts.push(stats.slides + ' слайдов')
        if (stats.paragraphs != null) parts.push(stats.paragraphs + ' абзацев')
        if (stats.words != null) parts.push(stats.words + ' слов')
        if (stats.tables != null) parts.push(stats.tables + ' таблиц')
        if (stats.images != null) parts.push(stats.images + ' изображений')
        if (stats.charts != null) parts.push(stats.charts + ' диаграмм')
        if (stats.approxPages != null) parts.push('~' + stats.approxPages + ' стр.')
        if (parts.length) statsHtml = '<div class="stats">' + esc(parts.join(' · ')) + '</div>'
      }

      var kind = String(d.kind || '').toLowerCase()
      var btns = '<button data-act="open">' + icon('open') + '<span>Открыть</span></button>'
        + '<button data-act="folder">' + icon('folder') + '<span>Показать в папке</span></button>'
      if (kind === 'word' || kind === 'ppt') {
        btns += '<button data-act="pdf">' + icon('pdf') + '<span>PDF</span></button>'
      }

      card.innerHTML =
        '<div class="head">' + badgeHtml(d.kind)
        + '<div style="min-width:0">'
        + '<div class="name">' + esc(d.name) + '</div>'
        + '<div class="meta">' + esc(fmtSize(d.size))
        + (d.op ? ' · ' + esc(opLabel(d.op)) : '') + '</div>'
        + '</div></div>'
        + statsHtml
        + '<div class="actions">' + btns + '</div>'
        + '<div class="err" id="err" style="display:none"></div>'
    }

    function showErr(msg) {
      var el = document.getElementById('err')
      if (el) { el.style.display = 'block'; el.textContent = msg }
    }

    document.getElementById('card').addEventListener('click', function (e) {
      var btn = e.target.closest ? e.target.closest('button[data-act]') : null
      if (!btn || !state.data) return
      var act = btn.getAttribute('data-act')
      var path = state.data.path
      var span = btn.querySelector('span')

      if (act === 'open') {
        synteeBridge.call('openFile', { path: path })
          .catch(function (err) { showErr('Не удалось открыть: ' + err.message) })
      } else if (act === 'folder') {
        synteeBridge.call('showInFolder', { path: path })
          .catch(function (err) { showErr(err.message) })
      } else if (act === 'pdf') {
        btn.disabled = true
        if (span) span.textContent = '…'
        synteeBridge.call('exportPdf', { path: path }).then(function () {
          btn.classList.add('done')
          if (span) span.textContent = 'Готово ✓'
        }).catch(function (err) {
          btn.disabled = false
          if (span) span.textContent = 'PDF'
          showErr('Ошибка PDF: ' + err.message)
        })
      }
    })

    // данные приходят window-сообщением от хоста
    window.addEventListener('message', function (e) {
      var d = e.data
      if (d && d.source === 'syntee-plugin-host' && d.widgetData) render(d.widgetData)
    })
  </script>
</body>
</html>
