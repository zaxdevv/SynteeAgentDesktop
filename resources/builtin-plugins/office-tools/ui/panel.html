<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Office Tools</title>
  <link rel="stylesheet" href="css/panel.css">
</head>
<body>
  <!-- Шапка: фиксирована, контент ниже скроллится -->
  <header class="ot-header">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <path d="M14 2v6h6"/>
      <path d="M8 13h8M8 17h5"/>
    </svg>
    <span>Office Tools</span>
  </header>

  <main class="ot-content" id="ot-content">
    <!-- Быстрые действия -->
    <section class="ot-section">
      <h2 class="ot-section-title">Быстрые действия</h2>
      <div class="ot-actions" id="ot-actions"></div>
      <div class="ot-error" id="ot-actions-err" style="display:none"></div>
    </section>

    <!-- Шаблоны -->
    <section class="ot-section">
      <h2 class="ot-section-title">Шаблоны</h2>
      <div id="ot-templates"><div class="ot-muted">Загрузка…</div></div>
    </section>

    <!-- Превью текущего документа -->
    <section class="ot-section">
      <h2 class="ot-section-title">Текущий документ</h2>
      <div id="ot-preview"><div class="ot-muted">Загрузка…</div></div>
    </section>

    <!-- Недавние файлы -->
    <section class="ot-section">
      <div class="ot-section-head">
        <h2 class="ot-section-title">Недавние файлы</h2>
        <button class="ot-link-btn" id="ot-clear-recent" title="Очистить список">Очистить</button>
      </div>
      <div id="ot-recent"><div class="ot-muted">Загрузка…</div></div>
      <div class="ot-error" id="ot-recent-err" style="display:none"></div>
    </section>

    <!-- Настройки -->
    <section class="ot-section">
      <h2 class="ot-section-title">Настройки</h2>
      <div id="ot-settings"><div class="ot-muted">Загрузка…</div></div>
    </section>
  </main>

  <script src="js/bridge.js"></script>
  <script src="js/actions.js"></script>
  <script src="js/recent.js"></script>
  <script src="js/preview.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/panel.js"></script>
</body>
</html>
